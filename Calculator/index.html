<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CalcPro | CodSoft Task 3</title>

    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <main class="container">

        <header class="header">
            <h2>Calc<span>Pro</span></h2>
            <p>CODSOFT · TASK 3</p>
        </header>

        <section class="intro">
            <p class="tagline">SIMPLE. SMART. PRECISE.</p>
            <h1>Your Everyday <span>Calculator.</span></h1>
            <p class="description">
                A simple, modern calculator built with HTML, CSS and JavaScript.
            </p>
        </section>

        <section class="calculator">

            <div class="calculator-header">
                <span>● CALCULATOR</span>
                <button type="button" id="clear">AC</button>
            </div>

            <div class="display">
                <div id="expression"></div>
                <input
                    type="text"
                    id="display"
                    value="0"
                    readonly
                    aria-label="Calculator display"
                >
            </div>

            <div class="buttons">
                <button type="button" data-action="clear" class="special">C</button>
                <button type="button" data-action="delete" class="special">DEL</button>
                <button type="button" data-action="percent" class="special">%</button>
                <button type="button" data-operator="/" class="operator">÷</button>

                <button type="button" data-number="7">7</button>
                <button type="button" data-number="8">8</button>
                <button type="button" data-number="9">9</button>
                <button type="button" data-operator="*" class="operator">×</button>

                <button type="button" data-number="4">4</button>
                <button type="button" data-number="5">5</button>
                <button type="button" data-number="6">6</button>
                <button type="button" data-operator="-" class="operator">−</button>

                <button type="button" data-number="1">1</button>
                <button type="button" data-number="2">2</button>
                <button type="button" data-number="3">3</button>
                <button type="button" data-operator="+" class="operator">+</button>

                <button type="button" data-action="sign" class="special">+/−</button>
                <button type="button" data-number="0">0</button>
                <button type="button" data-action="decimal">.</button>
                <button type="button" data-action="equals" class="equals">=</button>
            </div>

            <p class="calculator-footer">Made with HTML, CSS & JavaScript</p>
        </section>

        <footer>
            © <span id="year"></span> CalcPro · Student Project
        </footer>

    </main>

    <script src="./script.js"></script>

</body>
</html>
